<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/style.css">
  <title>Página de Listagem</title>
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/images/menu.png" alt="">
      <img id="logo_icon" src="assets/images/logo.png" alt="Logo do Youtube">
    </div>
    <div class="search_bar">
      <div class="search_text_area">
        <input type="text" name="search_bar_text" id="search_text" placeholder="Pesquisar">
      </div>
      <div class="search_text_icon">
        <img src="assets/images/search.png" alt="Botão para pesquisar">
      </div>
    </div>
    <div class="icons_account">
      <img src="assets/images/video.png" alt="Botão de da área do seu canal">
      <img src="assets/images/bell.png" alt="Botão de notificações">
      <img id="avatar_icon" src="assets/images/avatar.jpg" alt="Botão para acessar avatar">
    </div>
  </header>
  <main>
    <aside class="sidebar_area">
      <nav class="sidebar_nav">
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/home.png" alt="Ícone do home">
          <span>Inicio</span></a>
        </div>
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/compass.png" alt="Ícone do explorar">
          <span>Explorar</span></a>
        </div>
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/youtube.png" alt="Ícone das inscrições">
          <span>Inscrições</span></a>
        </div>
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/disc.png" alt="Ícone do youtube music">
          <span>Youyube Music</span></a>
        </div>
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/thumbs-up.png" alt="Ícone dos vídeos gostados">
          <span>Vídeos que gostei</span></a>
        </div>  
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/clock.png" alt="Ícone dos assistir mais tarde">
          <span>Assistir mais tarde</span></a>
        </div>
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/download.png" alt="Ícone de download">
          <span>Downloads</span></a>
        </div>
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/film.png" alt="Ícone dos filmes">
          <span>Filmes</span></a>
        </div>
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/book.png" alt="Ícone do aprender">
          <span>Aprender</span></a>
        </div>
        <div id="sidebar_nav_content">
          <a href="#"><img src="assets/images/award.png" alt="Ícone dos esportes">
          <span>Esportes</span></a>
        </div>
      </nav>
    </aside>
    <section class="video_section">
    </section>
  </main>
</body>
</html>
